name: P1-P4 proof-ready gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'binocmesher/**'
      - 'experiments/p1_p4/**'
      - '.github/workflows/p1-p4-proof-ready.yml'
  push:
    branches:
      - experiment/exact-event-upstream-p1-p4

jobs:
  official-pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            experiments/p1_p4/requirements-smoke.txt
            experiments/p1_p4/constraints-ubuntu22-gcc11-py310.txt
      - name: Install pinned smoke dependencies
        run: >-
          python -m pip install
          -r experiments/p1_p4/requirements-smoke.txt
          -c experiments/p1_p4/constraints-ubuntu22-gcc11-py310.txt
      - name: Strict focused compilation
        run: make -C binocmesher strict-focused
      - name: Full official four-mode smoke
        run: >-
          bash experiments/p1_p4/run_all.sh
          --repo "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/binoc-p1-p4"
          --full-official-smoke
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-p4-proof-ready-${{ github.sha }}
          path: ${{ runner.temp }}/binoc-p1-p4
          if-no-files-found: warn

  topology-tooling:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/topology-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install topology audit dependency
        run: python -m pip install numpy==1.26.4
      - name: Test isolated topology audit
        working-directory: experiments/p1_p4
        run: python -m unittest -v test_topology_audit.py
